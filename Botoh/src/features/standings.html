<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Race Standings</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --panel: #11151d;
      --panel-raised: #171d27;
      --line: #252d39;
      --muted: #929baa;
      --text: #f4f6f8;
      --accent: #ed2939;
      --accent-soft: rgba(237, 41, 57, .14);
      --green: #54d6a0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      padding: clamp(14px, 3vw, 36px);
      color: var(--text);
      background: radial-gradient(ellipse at 50% -15%, #202633 0, var(--bg) 58%);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }
    .container { width: min(100%, 1040px); margin: 0 auto; }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .19em;
      text-transform: uppercase;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 7px;
      color: white;
      background: var(--accent);
      font-size: 14px;
      font-style: italic;
      letter-spacing: -.08em;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid rgba(84, 214, 160, .25);
      border-radius: 999px;
      color: var(--green);
      background: rgba(84, 214, 160, .08);
      letter-spacing: .1em;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
    }
    .score-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding: clamp(20px, 4vw, 32px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-bottom: 3px solid var(--accent);
      border-radius: 14px 14px 0 0;
      background: linear-gradient(110deg, #171c25 0%, #11151d 68%, #21151b 100%);
    }
    .eyebrow {
      margin-bottom: 7px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    h1 {
      font-size: clamp(22px, 4vw, 34px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.045em;
      text-transform: uppercase;
    }
    .session-label {
      flex: 0 0 auto;
      padding: 8px 11px;
      border: 1px solid #3a424f;
      border-radius: 6px;
      color: #d9dee6;
      background: rgba(0, 0, 0, .2);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .table-card {
      padding: 8px 14px 4px;
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 14px 14px;
      background: rgba(17, 21, 29, .96);
      box-shadow: 0 22px 60px rgba(0, 0, 0, .28);
    }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; min-width: 590px; border-collapse: collapse; font-size: 13px; }
    thead th {
      padding: 13px 12px;
      color: #8993a2;
      border-bottom: 1px solid var(--line);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .14em;
      text-align: left;
      text-transform: uppercase;
      white-space: nowrap;
    }
    tbody tr { transition: background .18s ease; }
    tbody tr:hover { background: #1a202b; }
    tbody td { padding: 14px 12px; border-bottom: 1px solid rgba(255,255,255,.055); white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    .pos { width: 54px; color: #9ba4b1; font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .leader .pos { color: var(--accent); }
    .name { max-width: 260px; overflow: hidden; font-weight: 800; text-overflow: ellipsis; text-transform: uppercase; }
    .team { color: #c1c8d2; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .gap, .best-lap { color: #e1e5eb; font-variant-numeric: tabular-nums; font-weight: 700; }
    .leader .gap, .leader .best-lap { color: var(--green); }
    .laps, .pits { color: #d4dae2; text-align: center; font-variant-numeric: tabular-nums; }
    .pits { color: #ffbf69; }
    .info-box {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .info-row {
      flex: 1 1 220px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: #edf0f4;
      background: var(--panel-raised);
      font-size: 12px;
      font-weight: 700;
    }
    .small { display: block; margin-bottom: 5px; color: var(--muted); font-size: 9px; font-weight: 900; letter-spacing: .13em; text-transform: uppercase; }
    .timestamp { padding: 12px 2px 2px; color: var(--muted); font-size: 10px; text-align: right; font-variant-numeric: tabular-nums; }
    .empty-state { padding: 36px 16px; color: var(--muted); text-align: center; font-size: 13px; }
    @media (max-width: 560px) {
      body { padding: 12px; }
      .topline { font-size: 9px; letter-spacing: .12em; }
      .brand { gap: 7px; }
      .brand-mark { width: 24px; height: 24px; }
      .score-header { align-items: start; flex-direction: column; gap: 14px; padding: 20px; }
      .table-card { padding: 4px 8px; }
      thead th, tbody td { padding-right: 9px; padding-left: 9px; }
      .timestamp { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topline">
      <div class="brand"><span class="brand-mark">FH</span><span>Formula Haxball</span></div>
      <span class="live-badge"><span class="live-dot"></span>Live timing</span>
    </div>
    <header class="score-header">
      <div><div class="eyebrow">Race control · Standings</div><h1>Race classification</h1></div>
      <div class="session-label">On track</div>
    </header>

    <section class="table-card" aria-label="Race standings">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Pos</th><th>Driver</th><th>Team</th><th>Gap</th>
              <th>Laps</th><th>Pits</th>
            </tr>
          </thead>
          <tbody>
            
            <tr class="leader">
              <td class="pos">01</td>
              <td class="name">Nanoseb</td>
              <td class="team">Gorsche</td>
              <td class="gap">+0.000s</td>
              <td class="laps">5</td><td class="pits">1</td>
            </tr>
            
            <tr class="">
              <td class="pos">02</td>
              <td class="name">Leak</td>
              <td class="team">Gorsche</td>
              <td class="gap">+5 laps</td>
              <td class="laps">0</td><td class="pits">0</td>
            </tr>
            
          </tbody>
        </table>
      </div>

      <div class="info-box">
        <div class="info-row"><span class="small">Fastest lap · 2</span>Nanoseb <span>36.161s</span></div>
        
      </div>
      <div class="timestamp">Last updated · 19/10/2026, 20:21:05</div>
    </section>
  </div>

  <script>
    (function() {
      try {
        const evt = new EventSource('/events');
        evt.onmessage = function(e) { if (e.data === 'update') location.reload(); };
      } catch (err) { /* ignore */ }
    })();
  </script>
</body>
</html>
